databases:
  - name: regenesis-db
    plan: basic-256mb
    databaseName: regenesis_ai
    user: regenesis

services:
  - type: web
    name: regenesis-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: USE_SQLITE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: regenesis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OLLAMA_ENABLED
        value: "false"
      - key: WEB_SEARCH_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
